<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps4 lapse</title>
<style>
  html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8;
               font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
  #wrap { padding:16px 18px; }
  #state { font-size:22px; font-weight:700; margin:0 0 6px; }
  #stage { font-size:13px; color:#8b95a3; margin:0 0 10px; }
  #bar { height:8px; background:#18202a; border-radius:8px; overflow:hidden; margin:0 0 10px; }
  #fill { height:100%; width:8%; background:#36d7ff; transition:width .25s ease; }
  #out { white-space:pre-wrap; font:12px/1.45 Consolas, monospace;
         background:#11151b; border:1px solid #1e2732; border-radius:5px;
         padding:10px 12px; height:calc(100vh - 141px); overflow-y:auto; }
  .ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
  #brand { text-align:center; padding:8px 10px; background:#0e1116;
           border-bottom:1px solid #1e2732; }
  #brand img { width:28px; height:28px; margin-right:8px; border-radius:50%;
               vertical-align:middle; }
  #brand b { font-size:15px; font-weight:700; letter-spacing:.14em;
             color:#e6ebf2; vertical-align:middle; }
</style>
<link rel="stylesheet" href="zombie-gold.css">
</head>
<body>
<div id="brand"><img src="logo_raw.png" alt="" width="28" height="28"><b>JAILBREAK PS4 AMINE</b></div>
<div id="wrap">
  <div id="state">JAILBREAK PS4 AMINE</div>
  <div id="stage">جارٍ فحص نظام PS4 وتحضير التهكير...</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="out"></div>
</div>
<script>
(function () {
  var stage = document.getElementById('stage');
  var fill = document.getElementById('fill');
  var out = document.getElementById('out');
  function ui(t,p){ if(stage) stage.textContent=t; if(fill) fill.style.width=p+'%'; }
  ui('جارٍ قراءة Firmware تاع الجهاز...', 18);
  setTimeout(function(){ ui('جارٍ تحديد Lapse / Poops حسب Firmware...', 38); }, 450);
  setTimeout(function(){ ui('جارٍ تحضير ملفات التهكير...', 58); }, 950);
  setTimeout(function(){ ui('جارٍ تشغيل الـChain المناسب...', 78); }, 1450);
  var s=document.createElement('script');
  s.type='module'; s.src='./chain_router.mjs';
  s.onload=function(){ ui('تم اختيار الـChain — جاري التنفيذ...', 88); };
  s.onerror=function(e){ ui('خطأ في تحميل الـChain', 0); if(out) out.textContent='تعذر تحميل chain_router.mjs'; };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
