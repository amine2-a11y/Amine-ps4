<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>
PS4 JAILBREAK AMINE
</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:#030711;color:#eaf5ff;font-family:"Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden}
body{position:relative}
body:before{content:"";position:fixed;inset:0;background:url("preview.png") center/cover no-repeat;filter:brightness(.28) saturate(1.2);z-index:0}
body:after{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 10%,rgba(0,205,255,.18),transparent 36%),linear-gradient(180deg,rgba(2,7,17,.55),rgba(2,5,12,.95));z-index:0}
#wrap{position:relative;z-index:1;min-height:100vh;width:min(1100px,calc(100% - 28px));margin:auto;padding:26px 0}
#header{position:relative;text-align:center;padding:28px 18px 24px;border:1px solid rgba(83,193,255,.24);border-radius:27px;background:rgba(6,14,27,.68);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.07);overflow:hidden}
#header:before{content:"";position:absolute;top:0;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,#31ddff,#fff,#31ddff,transparent);box-shadow:0 0 18px #22cfff}
#header h1{font-size:clamp(32px,6vw,58px);font-weight:950;letter-spacing:2px;background:linear-gradient(120deg,#fff,#8beeff 45%,#4d83ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-transform:uppercase}
#header .english-name{margin-top:8px;font-size:16px;font-weight:800;letter-spacing:6px;color:#61dcff;text-shadow:0 0 18px rgba(53,205,255,.65)}
#header .sub{margin-top:13px;color:#829ab4;font-size:13px;letter-spacing:2px}
.neon-line{width:110px;height:2px;margin:18px auto 0;background:linear-gradient(90deg,transparent,#38dcff,transparent);box-shadow:0 0 15px #38dcff}
.phone{display:none!important}
#state{margin-top:18px;padding:20px;border:1px solid rgba(87,197,255,.18);border-radius:21px;background:rgba(5,14,27,.72);box-shadow:inset 0 1px rgba(255,255,255,.04),0 15px 45px rgba(0,0,0,.35)}
.loading-wrapper{display:flex;align-items:center;justify-content:center;gap:14px;text-align:center}
#stateText{font-size:clamp(18px,3vw,26px);font-weight:800;color:#eaf8ff}
#stateText small{font-size:12px;color:#6f8ba7;font-weight:500}
.loader{width:26px;height:26px;border:3px solid rgba(75,216,255,.16);border-top-color:#42dcff;border-right-color:#7c8cff;border-radius:50%;animation:spin .85s linear infinite;box-shadow:0 0 18px rgba(42,205,255,.25)}
.loader.done{animation:none;border-color:#48e1a4;box-shadow:0 0 18px rgba(72,225,164,.35)}
.loader-dots{display:flex;gap:5px}.loader-dots span{width:6px;height:6px;border-radius:50%;background:#35d8ff;box-shadow:0 0 10px #35d8ff;animation:dot 1.2s infinite}.loader-dots span:nth-child(2){animation-delay:.16s}.loader-dots span:nth-child(3){animation-delay:.32s}
#state.done{border-color:rgba(72,225,164,.28)}#state.error{border-color:rgba(255,92,116,.30)}
#out-container{margin-top:18px;padding:1px;border-radius:21px;background:linear-gradient(135deg,rgba(67,205,255,.20),rgba(91,99,255,.08))}
#out{height:calc(100vh - 250px);min-height:220px;overflow:auto;padding:18px 20px;border-radius:20px;background:rgba(2,7,15,.88);white-space:pre-wrap;font:12px/1.55 Consolas,"Courier New",monospace;color:#b9c9da}
#out::-webkit-scrollbar{width:7px}#out::-webkit-scrollbar-track{background:transparent}#out::-webkit-scrollbar-thumb{background:rgba(60,198,255,.28);border-radius:10px}
.footer{position:fixed;z-index:3;bottom:12px;left:0;right:0;text-align:center;color:rgba(139,188,220,.38);font-size:10px;letter-spacing:3px;font-weight:700}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes dot{0%,80%,100%{transform:scale(.55);opacity:.35}40%{transform:scale(1);opacity:1}}
@media(max-width:600px){#wrap{width:calc(100% - 14px);padding:12px 0}#header{padding:22px 12px 19px;border-radius:21px}#header .english-name{letter-spacing:3px}.loading-wrapper{gap:9px}#out{height:calc(100vh - 235px);padding:13px;font-size:11px}}
</style>
</head>


<body>


<div id="wrap">


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <div id="header">


    <h1>
PS4 JAILBREAK AMINE    </h1>


    <div class="english-name">JAILBREAK EDITION</div>


    <div class="sub">
      <span>
        PS4 WEBKIT • JAILBREAK EDITION
      </span>
    </div>


    <div class="neon-line"></div>


    <div class="phone">
     
    </div>


  </div>


  <!-- =====================================================
       حالة التشغيل
       ===================================================== -->

  <div id="state">

    <div class="loading-wrapper">


      <div
        id="loader"
        class="loader">
      </div>


      <span id="stateText">

        جارٍ تحميل سلسلة Poops

        <br>

        <small>
          Please wait... | انتظر قليلاً...
        </small>

      </span>


      <span class="loader-dots">

        <span></span>

        <span></span>

        <span></span>

      </span>


    </div>

  </div>


  <!-- =====================================================
       OUTPUT
       موجود ويعمل لكنه مخفي
       ===================================================== -->

  <div id="out-container">

    <div id="out"></div>

  </div>


</div>


<div class="footer">
  PS4 JAILBREAK AMINE • Poops
</div>


<script type="module">

import "./chain_poops.js";


const loader =
  document.getElementById("loader");

const state =
  document.getElementById("state");

const stateText =
  document.getElementById("stateText");


window.poopsDone = function () {

  loader.classList.add("done");

  state.classList.add("done");

  stateText.innerHTML =
    "اكتملت العملية بنجاح<br>" +
    "<small>Done successfully...</small>";

};


window.poopsError = function () {

  loader.classList.remove("done");

  state.classList.add("error");

  stateText.innerHTML =
    "حدث خطأ أثناء التنفيذ<br>" +
    "<small>Something went wrong...</small>";

};

</script>


</body>
</html>
