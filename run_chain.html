<!doctype html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 Exploit Chain</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100vh;background:#080b11;color:#eef3f8;font:18px/1.5 "Segoe UI",Tahoma,sans-serif}body{display:flex;align-items:center;justify-content:center;padding:24px}#panel{width:min(760px,100%);padding:30px;border-radius:24px;background:rgba(18,25,35,.9);box-shadow:0 20px 60px rgba(0,0,0,.45);text-align:center}h1{margin:0 0 12px}.muted{opacity:.75}#out{margin-top:20px;min-height:80px}.back{margin-top:22px;padding:12px 18px;border:0;border-radius:12px;cursor:pointer;font-weight:700}
</style>
</head>
<body>
<div id="panel"><h1 id="title">جارٍ تحميل سلسلة الاستغلال...</h1><div class="muted">PS4 AI TOOL</div><div id="out"></div><button class="back" onclick="location.href='index.html'">العودة</button></div>
<script>
// Optional Service Worker for browsers that support it; AppCache handles legacy PS4 WebKit.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js').catch(function () {});
}
</script>
<script>
const chain = new URLSearchParams(location.search).get('chain');
const out = document.getElementById('out');
const title = document.getElementById('title');
if(chain==='bundle') title.textContent='PSFree Lapse Bundle';
else if(chain==='netctrl') title.textContent='CSSFontFace POOPS NetCtrl';
else if(chain==='lapse') title.textContent='CSSFontFace Lapse';
else title.textContent='سلسلة غير معروفة';
function getScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s);});}
(async()=>{
 try{
  if(chain==='bundle'){out.textContent='Loading PSFree Lapse Bundle...'; await getScript('./src/psfree-lapse/bundle.js'); if(typeof doJailBreak==='function') doJailBreak();}
  else if(chain==='netctrl' || chain==='lapse'){out.textContent='Loading CSSFontFace...'; await getScript('./src/cssfontface/main.js'); if(typeof doCssFontFaceJailbreak==='function') await doCssFontFaceJailbreak();}
  else throw new Error('Unknown chain');
 }catch(e){out.textContent='فشل التحميل: '+e.message;}
})();
</script>
</body>
</html>
