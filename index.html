<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>
PS4 JAILBREAK AMINE
</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:#02040a;color:#fff;font-family:"Segoe UI",Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:url("preview.png") center/cover no-repeat;filter:brightness(.38) saturate(1.15);z-index:0}
body:after{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(2,4,10,.55),rgba(2,4,10,.15),rgba(2,4,10,.60)),linear-gradient(0deg,rgba(2,4,10,.75),transparent 55%);z-index:0}
#container{position:relative;z-index:2;width:min(950px,calc(100% - 24px));padding:28px;border:1px solid rgba(151,57,255,.55);border-radius:24px;background:rgba(5,7,14,.76);backdrop-filter:blur(10px);box-shadow:0 25px 90px #000,0 0 45px rgba(126,35,255,.16)}
#main-header{text-align:center;padding:4px 8px 20px}
#main-header h1{font-size:clamp(35px,7vw,70px);font-weight:950;line-height:.95;letter-spacing:2px;color:#fff;text-shadow:0 3px 0 #222,0 0 25px rgba(255,255,255,.16);text-transform:uppercase}
#main-header h1:after{content:" AMINE";display:block;color:#8e2cff;font-size:.82em;font-style:italic;text-shadow:0 0 22px #7d1dff}
#main-header .sub{margin-top:13px;color:#eee;letter-spacing:5px;font-size:13px;text-transform:uppercase}
#main-header .sub:after{content:"  •  JAILBREAK  •  HOMEBREW";color:#a35aff}
.card{padding:18px;border-top:1px solid rgba(159,72,255,.35)}
#state{padding:18px 20px;text-align:center;border:1px solid rgba(154,56,255,.6);border-radius:15px;background:rgba(10,8,19,.82);font-size:clamp(20px,3.5vw,29px);font-weight:900;color:#fff;box-shadow:0 0 24px rgba(129,35,255,.16)}
#state.warn{color:#ffd96a;border-color:#e5a900}#state.bad{color:#ff7185;border-color:#ff3858}
#det{margin-top:12px;padding:14px;text-align:center;border-radius:13px;background:rgba(0,0,0,.45);color:#b9b9c7;border:1px solid rgba(255,255,255,.09);font-size:15px}
#cache{margin-top:9px;text-align:center;color:#8790a5;font-size:12px}.cacheok{color:#62e6a8!important}
.loading{display:flex;justify-content:center;gap:6px;margin-top:14px}.loader-dot{width:7px;height:7px;border-radius:50%;background:#9d36ff;box-shadow:0 0 12px #9d36ff;animation:p 1.1s infinite}.loader-dot:nth-child(2){animation-delay:.15s}.loader-dot:nth-child(3){animation-delay:.3s}
.footer-brand{position:fixed;z-index:3;bottom:10px;left:0;right:0;text-align:center;color:rgba(205,181,235,.45);font-size:10px;letter-spacing:3px}
@keyframes p{0%,80%,100%{opacity:.3;transform:scale(.6)}40%{opacity:1;transform:scale(1)}}
@media(max-width:600px){#container{padding:20px 12px;border-radius:18px}#main-header h1{font-size:38px}#main-header .sub{letter-spacing:2px}.card{padding:12px}}
</style>
</head>


<body>


<div id="container">


  <!-- HEADER -->

  <div id="main-header">

    <h1>PS4 JAILBREAK</h1>

    <div class="sub"><span>PS4 JAILBREAK</span></div>

  </div>


  <!-- MAIN CARD -->

  <div class="card">


    <div id="state">

      جارٍ كشف النسخة...

    </div>


    <div id="det"></div>


    <div id="cache"></div>


    <!-- Loading -->

    <div class="loading">

      <span class="loader-dot"></span>

      <span class="loader-dot"></span>

      <span class="loader-dot"></span>

    </div>


  </div>


</div>


<!-- FOOTER -->

<div class="footer-brand">
  PS4 JAILBREAK AMINE
</div>


<script>

(function () {


    var stateEl =
        document.getElementById("state");


    var detEl =
        document.getElementById("det");


    var cacheEl =
        document.getElementById("cache");


    function setState(t, c) {

        stateEl.innerHTML = t;

        stateEl.className = c || "";

    }


    function setCache(t, ok) {

        cacheEl.textContent = t;

        cacheEl.className =
            ok ? "cacheok" : "";

    }


    var params =
        new URLSearchParams(location.search);


    var key = null,
        fwnum = null;


    var m =
        /PlayStation\s+4[\/ ](\d+)\.(\d+)/
        .exec(navigator.userAgent);


    if (m) {

        var minor =
            parseInt(m[2], 16);

        var ms =
            minor.toString(16);


        if (ms.length < 2)
            ms = "0" + ms;


        key =
            m[1] + "." + ms;


        fwnum =
            parseInt(m[1], 10) * 100
            +
            parseInt(ms, 10);

    }


    var bug = null,
        why = "";


    var forced =
        params.get("bug");


    if (
        forced === "lapse" ||
        forced === "poops"
    ) {

        bug = forced;

        why =
            "تم التحديد يدوياً ?bug="
            +
            forced;

    }

    else if (!key) {

        why =
            "هذا المتصفح ليس بلايستيشن 4";

    }

    else if (fwnum <= 1202) {

        bug = "lapse";

        why =
            key +
            " — متوافق (Lapse)";

    }

    else if (fwnum >= 1250) {

        bug = "poops";

        why =
            key +
            " — متوافق (Poops)";

    }

    else {

        why =
            key +
            " — غير مدعوم";

    }


    /*
     * عرض معلومات النظام
     */

    var fwDisplay =
        key
        ?
        "<b>" + key + "</b>"
        :
        "<span style='color:#8f9eb0;'>غير معروف</span>";


    var bugDisplay =
        bug
        ?
        "<span class='chip'>"
        +
        bug.toUpperCase()
        +
        "</span>"
        :
        "<span style='color:#8f9eb0;'>لا يوجد</span>";


    detEl.innerHTML =

        "النظام "

        +
        fwDisplay

        +
        " &nbsp;•&nbsp; "

        +
        "الثغرة "

        +
        bugDisplay

        +
        " &nbsp;•&nbsp; "

        +
        why;


    /*
     * إذا لم تكن النسخة مدعومة
     */

    if (!bug) {

        setState(
            "نسخة غير مدعومة",
            "bad"
        );

        return;

    }


    /*
     * تحديد الصفحة المطلوبة
     */

    var target =

        (
            bug === "lapse"
            ?
            "run_lapse.html"
            :
            "PS4_13.00_Webkit.html"
        )
        +
        location.search;


    function go() {

        setState(
            "جارٍ تحميل "
            +
            bug
            +
            " ...",
            "warn"
        );


        location.replace(target);

    }


    /*
     * انتظار الضغط
     */

    function waitForTap(msg, action) {

        setState(
            msg,
            "warn"
        );


        function fire() {

            window.removeEventListener(
                "click",
                fire
            );


            window.removeEventListener(
                "keydown",
                fire
            );


            action();

        }


        window.addEventListener(
            "click",
            fire
        );


        window.addEventListener(
            "keydown",
            fire
        );

    }


    /*
     * Application Cache
     */

    var ac =
        window.applicationCache;


    if (
        !ac ||
        !document.documentElement
            .hasAttribute("manifest")
    ) {

        go();

    }

    else if (!navigator.onLine) {

        setCache(
            "غير متصل — التشغيل من الوضع المحلي Offline",
            true
        );

        go();

    }

    else if (
        ac.status === ac.IDLE
    ) {

        setCache(
            "الوضع المحلي Offline جاهز",
            true
        );

        go();

    }

    else if (
        ac.status === ac.UPDATEREADY
    ) {

        try {
            ac.swapCache();
        }
        catch (e) {}


        setCache(
            "تم تحميل التحديث",
            true
        );


        waitForTap(
            "تحديث جاهز — اضغط للتحديث والتشغيل",
            function () {

                location.reload();

            }
        );

    }

    else {


        setCache(
            "جارٍ التحقق من الوضع المحلي Offline..."
        );


        ac.addEventListener(
            "downloading",
            function () {

                setCache(
                    "الوضع المحلي Offline للمرة الأولى..."
                );

            },
            false
        );


        ac.addEventListener(
            "progress",
            function (e) {

                if (
                    e &&
                    e.total
                ) {

                    setCache(
                        "تخزين "
                        +
                        Math.round(
                            (e.loaded / e.total) * 100
                        )
                        +
                        "%"
                    );

                }

            },
            false
        );


        ac.addEventListener(
            "cached",
            function () {

                setCache(
                    "تم الوضع المحلي Offline — جاهز للاستخدام دون اتصال",
                    true
                );


                waitForTap(
                    "جاهز — اضغط للتشغيل",
                    go
                );

            },
            false
        );


        ac.addEventListener(
            "updateready",
            function () {

                try {
                    ac.swapCache();
                }
                catch (e) {}


                setCache(
                    "التحديث جاهز",
                    true
                );


                waitForTap(
                    "تحديث جاهز — اضغط لإعادة التحميل",
                    function () {

                        location.reload();

                    }
                );

            },
            false
        );


        ac.addEventListener(
            "noupdate",
            function () {

                setCache(
                    "الوضع المحلي Offline جاهز",
                    true
                );


                go();

            },
            false
        );


        ac.addEventListener(
            "error",
            function () {

                setCache(
                    "فشل الوضع المحلي Offline"
                );


                waitForTap(
                    "فشل التخزين — اضغط للتشغيل رغم ذلك",
                    go
                );

            },
            false
        );


        ac.addEventListener(
            "obsolete",
            function () {

                setCache(
                    "الوضع المحلي Offline قديم"
                );


                waitForTap(
                    "التخزين قديم — اضغط للتشغيل",
                    go
                );

            },
            false
        );

    }


})();

</script>

</body>
</html>
