<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 Firmware Checker</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0;padding:28px}
.card{max-width:650px;margin:auto;background:#1d1d1d;border-radius:16px;padding:24px}
h1{text-align:center}
#current{text-align:center;font-size:28px;font-weight:700;margin:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ver{padding:12px;border-radius:10px;background:#303030;text-align:center}
.active{outline:3px solid #fff;font-weight:700}
.small{text-align:center;color:#aaa;margin-top:18px;font-size:13px}
</style>
</head>
<body>
<div class="card">
<h1>PS4 Firmware</h1>
<div id="current">Checking…</div>
<div id="list" class="grid"></div>
<div class="small">Detects the firmware from the PS4 browser User-Agent only.</div>
</div>
<script>
const versions = [
"9.00","9.03","9.04",
"9.50","9.51","9.60","9.61",
"10.00","10.01","10.50","10.70","10.71",
"11.00","11.02","11.50","11.52",
"12.00","12.02","12.50","12.70",
"13.00","13.02","13.50","13.52",
"14.00","14.01","14.50","14.51"
];

const ua = navigator.userAgent || "";
const m = ua.match(/PlayStation\s+4[\/ ](\d+)\.(\d+)/i);
const current = m ? m[1] + "." + m[2] : null;

document.getElementById("current").textContent =
  current ? "Current: " + current : "Current: Unknown";

const list = document.getElementById("list");
versions.forEach(v => {
  const d = document.createElement("div");
  d.className = "ver" + (v === current ? " active" : "");
  d.textContent = v + (v === current ? " ✓" : "");
  list.appendChild(d);
});
</script>
</body>
</html>
